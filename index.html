<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Milano - Admin & Segnalibri</title>
    <style>
        /* Aumento generale della dimensione dei caratteri per maggiore leggibilità */
        body {
            font-size: 18px;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            font-size: 28px;
        }
        h2 {
            font-size: 24px;
        }
        p, label, input, button, a {
            font-size: 18px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .admin-section {
            margin-top: 30px;
            padding: 20px;
            background: #eef2f7;
            border-radius: 6px;
        }
        button {
            padding: 12px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .hidden-share {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Taxi Milano</h1>
    <p>Benvenuto nell'applicazione ufficiale. I contenuti e i segnalibri sono protetti e riservati.</p>
    
    <!-- Pulsante bloccato e sterilizzato contro qualsiasi condivisione -->
    <button id="shareBtn" onclick="return false;" style="background-color: #ccc; cursor: not-allowed;" disabled>Condivisione Disattivata</button>

    <div class="admin-section">
        <h2>Sezione Admin</h2>
        <p>Link ufficiale dell'amministratore:</p>
        <p><a href="https://meroandrea-bot.github.io/Taxi-Milano/" target="_blank">https://meroandrea-bot.github.io/Taxi-Milano/</a></p>
    </div>
</div>

<script>
    /* BLOCCO TOTALE ANTICONDIVISIONE */
    // 1. Disattiva completamente l'API di condivisione nativa del browser mobile/desktop
    if (navigator.share) {
        navigator.share = function () {
            return Promise.reject(new Error("Funzione di condivisione disabilitata dall'amministratore."));
        };
    }

    // 2. Intercetta e annulla qualsiasi tentativo di attivazione tramite eventi o tasti
    document.addEventListener('DOMContentLoaded', (event) => {
        const shareBtn = document.getElementById('shareBtn');
        if (shareBtn) {
            shareBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                alert("La condivisione di questo link non è consentita.");
                return false;
            }, true);
        }
    });

    // 3. Blocca scorciatoie da tastiera comuni legate alla condivisione (es. Ctrl+S / menu contestuali di condivisione)
    window.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'h')) {
            e.preventDefault();
        }
    });
</script>

</body>
</html>
